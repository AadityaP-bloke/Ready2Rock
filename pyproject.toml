[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ready2rock"
version = "0.1.0"
description = "Prepare music files for Rockbox players: convert, tag from MusicBrainz, fix artwork and organize folders."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ready2Rock contributors" }]
dependencies = [
    "mutagen>=1.47",
    "Pillow>=10.0",
    "musicbrainzngs>=0.7.1",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.6"]
test = ["pytest>=7.4"]
packaging = ["pyinstaller>=6.10", "python-appimage>=1.4"]

[project.scripts]
ready2rock = "ready2rock.cli:main"
ready2rock-gui = "ready2rock.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
